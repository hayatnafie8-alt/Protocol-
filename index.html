    <!-- Global Early Capture for Native PWA Install Prompt & protocol_fab_icon -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-deferred-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
      document.addEventListener('DOMContentLoaded', function() {
        try {
          var savedFab = localStorage.getItem('protocol_bottom_nav_fab_icon') || localStorage.getItem('protocol_fab_icon');
          if (savedFab) {
            var img = document.getElementById('centerFabIconImg');
            if (img) img.src = savedFab;
          }
        } catch (e) {}
      });
    </script>
